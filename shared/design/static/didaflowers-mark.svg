<?xml version="1.0" encoding="UTF-8"?>
<!-- didaflowers mark. Self-contained: works as img, css background, or inline.
     Theme it inline with CSS custom properties: df-petal, df-petal-stroke,
     df-core, df-core-stroke, df-stroke. Default palette is coral. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 70 70" role="img"
     aria-label="didaflowers — marchio fiore" class="df-flower-svg">
  <style>
    .df-petal,
    .df-petal-detach {
      fill: var(--df-petal, #d96d60);
      stroke: var(--df-petal-stroke, #b5504a);
      stroke-width: var(--df-stroke, 1);
      stroke-linejoin: round;
    }
    .df-core {
      fill: var(--df-core, #b5504a);
      stroke: var(--df-core-stroke, var(--df-petal-stroke, #b5504a));
      stroke-width: var(--df-stroke, 1);
    }
    /* Detaching petal: resting state = final state (also the reduced-motion state). */
    .df-petal-detach {
      transform-box: fill-box;
      transform-origin: center;
      transform: translate(18.4px, -18.4px) rotate(63deg) scale(0.82);
      opacity: 0.42;
      animation: df-detach 2200ms cubic-bezier(0.25, 1, 0.5, 1) 450ms 1 both;
    }
    @keyframes df-detach {
      0%   { transform: translate(0, 0) rotate(45deg) scale(1); opacity: 1; }
      100% { transform: translate(18.4px, -18.4px) rotate(63deg) scale(0.82); opacity: 0.42; }
    }
    @media (prefers-reduced-motion: reduce) {
      .df-petal-detach { animation: none; }
    }
  </style>
  <g class="df-mark">
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(0 41 49)"/>
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(90 41 49)"/>
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(135 41 49)"/>
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(180 41 49)"/>
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(225 41 49)"/>
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(270 41 49)"/>
    <ellipse class="df-petal" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(315 41 49)"/>
    <ellipse class="df-petal-detach" cx="48.49" cy="40.52" rx="5.8" ry="11"/>
    <circle class="df-core" cx="41" cy="49" r="7"/>
  </g>
</svg>
