    <ellipse fill="#ffffff" stroke="#d96d60" stroke-width="1" stroke-linejoin="round" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(180 41 49)"/>
    <ellipse fill="#ffffff" stroke="#d96d60" stroke-width="1" stroke-linejoin="round" cx="41" cy="37" rx="5.8" ry="11" transform="rotate(225 41 49)"/>
